# Foundry sits alongside Hardhat: Hardhat compiles + deploys, Foundry runs the fast
# game-logic tests. IncoTest mocks the whole Inco stack in-process, so `forge test`
# needs no Docker and no covalidator.
[profile.default]
src = "contracts"
out = "forge-out"
test = "test-forge"
cache_path = "forge-cache"
libs = ["node_modules", "../node_modules"]
solc = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
