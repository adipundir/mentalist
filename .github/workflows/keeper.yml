name: keeper

# Files everybody's verdict once a case closes, then shuts the books.
#
# Vercel's free tier allows one cron a day and a case runs for thirty minutes, so the
# schedule lives here instead. GitHub runs these late under load, which is survivable:
# every step is idempotent and the site nudges the same endpoint whenever somebody opens
# a case that is due, so a delayed run costs a few minutes and never a settlement.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  settle:
    runs-on: ubuntu-latest
    steps:
      - name: File verdicts and settle closed cases
        run: |
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' --max-time 120 \
            -H "authorization: Bearer ${{ secrets.KEEPER_SECRET }}" \
            "${{ secrets.KEEPER_URL }}")
          cat /tmp/out.json
          test "$code" = "200"
